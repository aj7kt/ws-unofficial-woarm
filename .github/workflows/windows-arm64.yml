name: Windows on Arm build

on:
  push:
    branches: [main, windows-on-arm]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      hamlib_release:
        description: hamlib-woarm-builds release tag to build against ('latest' for the newest)
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hamlib comes prebuilt (libhamlib-4.dll, headers, import library, rigctl
  # tools) from a pinned release of the separate hamlib-woarm-builds repo.
  # Move to a newer Hamlib by changing this tag.
  HAMLIB_RELEASE_REPO: aj7kt/hamlib-woarm-builds
  HAMLIB_RELEASE: hamlib-4.7.3-rc-f788e348d-win-arm64
  # MSYS2 CLANGARM64: clang/flang/lld, Qt 6, Boost, FFTW, ...
  MSYS2_PACKAGES: >-
    git
    mingw-w64-clang-aarch64-clang
    mingw-w64-clang-aarch64-lld
    mingw-w64-clang-aarch64-flang
    mingw-w64-clang-aarch64-llvm-openmp
    mingw-w64-clang-aarch64-llvm-tools
    mingw-w64-clang-aarch64-cmake
    mingw-w64-clang-aarch64-ninja
    mingw-w64-clang-aarch64-pkgconf
    mingw-w64-clang-aarch64-qt6-base
    mingw-w64-clang-aarch64-qt6-multimedia
    mingw-w64-clang-aarch64-qt6-serialport
    mingw-w64-clang-aarch64-qt6-websockets
    mingw-w64-clang-aarch64-qt6-svg
    mingw-w64-clang-aarch64-qt6-tools
    mingw-w64-clang-aarch64-qt6-translations
    mingw-w64-clang-aarch64-qt6-imageformats
    mingw-w64-clang-aarch64-qt6-activeqt
    mingw-w64-clang-aarch64-boost
    mingw-w64-clang-aarch64-fftw
    mingw-w64-clang-aarch64-libusb
    mingw-w64-clang-aarch64-portaudio

jobs:
  # One job builds all three layouts: MSYS2 is set up once, and after the
  # first layout only ws.exe is rebuilt for the others (the layout affects
  # that target alone). Installs go outside the checkout: the sources have
  # an INSTALL file, and Windows file names are case-insensitive.
  ws:
    name: WS (standard, AL, widescreen)
    runs-on: windows-11-arm
    steps:
      # Keep the sources' line endings as committed.
      - run: git config --global core.autocrlf false
        shell: pwsh

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0     # version info is derived from git

      # CI always builds against a release (never a local Hamlib tree).
      - name: Fetch and verify the Hamlib release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./ci/fetch-hamlib-release.ps1 -Dest ../hamlib-install
          -Repo $env:HAMLIB_RELEASE_REPO
          -Tag '${{ inputs.hamlib_release || env.HAMLIB_RELEASE }}'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: ${{ env.MSYS2_PACKAGES }}

      - name: Build and install (standard)
        shell: msys2 {0}
        run: WS_LAYOUT=standard bash ci/build-ws.sh . ../ws-build ../ws-install-standard ../hamlib-install

      - name: Decoder smoke test
        shell: msys2 {0}
        run: bash ci/smoke-test.sh "$PWD/../ws-build" "$PWD/../smoke"

      - name: Build and install (AL)
        shell: msys2 {0}
        run: WS_LAYOUT=al bash ci/build-ws.sh . ../ws-build ../ws-install-al ../hamlib-install

      - name: Build and install (widescreen)
        shell: msys2 {0}
        run: WS_LAYOUT=widescreen bash ci/build-ws.sh . ../ws-build ../ws-install-widescreen ../hamlib-install

      - name: Check every bundled binary is ARM64
        shell: msys2 {0}
        run: |
          bad=0
          for f in ../ws-install-*/bin/*.exe ../ws-install-*/bin/*.dll; do
            fmt=$(llvm-objdump -f "$f" | grep -o 'coff-[a-z0-9-]*')
            [ "$fmt" = coff-arm64 ] || { echo "not ARM64: $f ($fmt)"; bad=1; }
          done
          exit $bad

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $ver = (git describe --tags --always)
          New-Item -ItemType Directory dist | Out-Null
          foreach ($layout in 'standard', 'al', 'widescreen') {
            Compress-Archive -Path "../ws-install-$layout/*" -DestinationPath "dist/WS-3.2.1-win-arm64-$layout-$ver.zip"
          }
          Get-ChildItem dist | Format-Table Name, Length
          "name=WS-3.2.1-win-arm64-$ver" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*.zip

  # A standing *draft* release per branch (placeholder tag next-<branch>),
  # updated in place by every successful push build: same draft, new zips,
  # SHA256SUMS, target commit and notes. Drafts are visible only to people
  # with write access; nothing is public until you promote the draft: edit
  # it, change the tag to e.g. v3.2.1-woa1 and publish. The next build then
  # starts a new standing draft. Notes typed into the draft are replaced by
  # the next build, so write them when promoting. Tag pushes and pull
  # requests do not touch the draft.
  draft:
    needs: ws
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: standing-draft-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: WS-*
          merge-multiple: true
          path: dist

      - name: Update the standing draft release
        run: |
          set -euo pipefail
          R=$GITHUB_REPOSITORY
          tag="next-${GITHUB_REF_NAME//\//-}"
          short=$(cut -c1-9 <<<"$GITHUB_SHA")
          title="WS 3.2.1 for Windows on Arm, next from $GITHUB_REF_NAME (build ${{ github.run_number }}, $short)"
          (cd dist && sha256sum *.zip > SHA256SUMS)
          {
            echo "Native Windows on Arm (ARM64) builds of WS 3.2.1, one zip per main window layout."
            echo
            echo "- commit: $GITHUB_SHA ($GITHUB_REF_NAME)"
            echo "- built by: $GITHUB_SERVER_URL/$R/actions/runs/$GITHUB_RUN_ID"
            echo "- Hamlib: ${{ env.HAMLIB_RELEASE }}"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "_Standing draft, replaced by every build of $GITHUB_REF_NAME. To release it,"
            echo "change the tag (e.g. to v3.2.1-woa1), write the notes and publish._"
          } > notes.md

          state=$(TAG="$tag" gh release list -R "$R" --limit 200 --json tagName,isDraft \
                    --jq '.[] | select(.tagName == env.TAG) | if .isDraft then "draft" else "published" end')
          case "$state" in
            published)
              echo "::error::$tag is a published release; refusing to overwrite it"; exit 1 ;;
            draft)
              echo "updating standing draft $tag"
              gh release edit "$tag" -R "$R" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
              gh release view "$tag" -R "$R" --json assets --jq '.assets[].name' |
                while read -r a; do gh release delete-asset "$tag" "$a" -R "$R" --yes; done
              gh release upload "$tag" -R "$R" dist/*.zip dist/SHA256SUMS ;;
            *)
              echo "creating standing draft $tag"
              gh release create "$tag" -R "$R" --draft --target "$GITHUB_SHA" \
                --title "$title" --notes-file notes.md dist/*.zip dist/SHA256SUMS ;;
          esac
